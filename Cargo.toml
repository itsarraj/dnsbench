[package]
name = "dnsbench"
version = "0.1.0"
edition = "2021"
description = "A fast, concurrent multi-resolver DNS benchmarking and propagation auditing CLI tool"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/dnsbench"
readme = "README.md"
keywords = ["dns", "benchmark", "propagation", "latency", "resolver"]
categories = ["command-line-utilities", "network-programming", "development-tools"]

[lib]
name = "dnsbench"
path = "src/lib.rs"

[[bin]]
name = "dnsbench"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
